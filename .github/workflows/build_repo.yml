name: Build and Deploy Jailbreak Repo

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Compression Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bzip2 zstd

      - name: Generate Packages File from TOML
        run: python generate_repo.py

      - name: Compress Packages File (bz2 and zst)
        run: |
          bzip2 -f -k Packages
          zstd -q -c19 Packages > Packages.zst

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .